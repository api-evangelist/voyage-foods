- capability: store_metadata
  fields: [shop, localization, locations, paymentSettings, publicApiVersions, sitemap, urlRedirects, shopPayInstallmentsPricing]
  reason: Shop configuration, market/localization and API-version metadata have no UCP tool.
- capability: cart_extras
  fields: [cartClone, cartAttributesUpdate, cartNoteUpdate, cartMetafieldsSet, cartMetafieldDelete, cartGiftCardCodesAdd, cartGiftCardCodesRemove, cartGiftCardCodesUpdate, cartBillingAddressUpdate, cartDeliveryAddressesRemove, cartDeliveryAddressesReplace]
  reason: >-
    Cart notes, attributes, metafields and gift-card codes are exposed in GraphQL but absent from the
    UCP tool payloads (discount codes are present; gift cards are not).
- capability: shop_pay
  fields: [shopPayPaymentRequestSessionCreate, shopPayPaymentRequestSessionSubmit]
  reason: >-
    Shop Pay request sessions are a GraphQL mutation pair; in UCP the same capability appears as the
    dev.shopify.shop_pay payment handler in /.well-known/ucp rather than as a tool.
