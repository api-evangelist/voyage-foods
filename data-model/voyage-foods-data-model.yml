core_path:
  description: The join path an agent walks to go from intent to order.
  steps:
  - Collection -> Product (products)
  - Product -> ProductVariant (variants / selectedOrFirstAvailableVariant)
  - ProductVariant -> CartLine (merchandise)
  - CartLine -> Cart (lines)
  - Cart -> Checkout (cartPrepareForCompletion / UCP create_checkout with cart_id)
  - Checkout -> Order (cartSubmitForCompletion / UCP complete_checkout)
  - Order -> Customer (orders)
live_catalog_observed:
  source: https://voyagefoods.com/products.json
  status: 200
  note: >-
    The published storefront catalog is a sample/bulk ordering catalog for CPG buyers (product and
    application sample boxes, spread and cocoa-free chocolate samples), not the retail SKUs sold
    through grocery. Collections observed: nut-free-spreads, samples, spreads-samples,
    cocoa-free-chocolate-samples, bean-free-coffee-samples, application-samples, custom-samples,
    marketing-sample-materials, bean-free-coffee-special-request-samples, pr-investor-sample,
    bulk-samples, frontpage.
