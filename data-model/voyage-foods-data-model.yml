note: >-
  There is no OpenAPI for this provider, so relationships are taken from GraphQL field types rather
  than from $ref links. Only the commerce core is modelled; the full schema carries 416 types.
identifier_scheme:
  format: 'gid://shopify/{Type}/{id}'
  examples:
  - 'gid://shopify/Product/8612021108928'
  - 'gid://shopify/ProductVariant/48477912268992'
  - 'gid://shopify/Cart/{id}?key={secret}'
  - 'gid://shopify/Checkout/{id}'
  - 'gid://shopify/Order/{id}'
  note: >-
    Cart GIDs embed a ?key= capability secret; possession of the cart id is possession of access to
    that cart.
