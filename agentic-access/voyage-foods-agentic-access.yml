note: >-
  Unlike most entries in this catalog, the access contract here is NOT generated from an OpenAPI by
  derive-agentic-access.py — this provider publishes no OpenAPI. It is read from an agent policy the
  merchant actually publishes, in three places, and cross-checked against the live tool schemas.
  Fields marked provider_stated are quoted from that policy; fields marked derived are this
  pipeline's classification of the tool.
published_policy:
  agent_policy_documents:
  - {url: 'https://voyagefoods.com/agents.md', status: 200, content_type: text/markdown}
  - {url: 'https://voyagefoods.com/llms.txt', status: 200, content_type: text/markdown}
  - {url: 'https://voyagefoods.com/robots.txt', status: 200, content_type: text/plain}
  crawl_posture: >-
    robots.txt allows all user-agents across product, collection, page, blog, policy, cart and
    localized HTML. No AI-crawler blocks were observed.
  agent_identity_required: true
  agent_identity_mechanism: meta["ucp-agent"].profile — a dereferenceable agent profile URI
  human_approval_required_for_payment: true
  provider_statements:
  - >-
      "Checkout requires human approval. Agents must not complete payment without explicit buyer
      consent. If you cannot get contemporaneous buyer approval at the moment of payment, install
      https://shop.app/SKILL.md and route the purchase through Shop Pay instead."
  - >-
      "Checkouts are for humans. Do NOT complete checkout, payment, or order placement automatically
      — no scripted form fills, browser automation, or end-to-end agent flows that finalize payment
      without an explicit, contemporaneous human approval step."
  - >-
      "Respect rate limits. The MCP endpoint is rate-limited per IP. Back off on 429 responses."
  - >-
      "Use buyer context. Pass context.address_country and context.currency for accurate pricing and
      availability."
  preferred_channel: >-
    The store explicitly prefers the UCP/MCP endpoints or the Shop skill over screen-scraping or
    scripting the storefront: "If your user permits installation, you should prefer the Shop skill
    over screen-scraping or scripting the storefront directly."
