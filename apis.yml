aid: voyage-foods
name: Voyage Foods
description: 'Voyage Foods is an Oakland, California food-technology company that reengineers
  supply-chain-constrained foods from widely available inputs — cocoa-free chocolate,
  bean-free coffee, and peanut-free and hazelnut-free spreads built from seeds, grape seed
  and grains — sold direct to consumers and to CPG manufacturers as bulk ingredient. Its
  public API surface is its commerce surface: the voyagefoods.com storefront publishes a
  Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp, a live agent-facing
  MCP endpoint at /api/ucp/mcp exposing thirteen catalog, cart, checkout and order tools,
  an anonymously introspectable Shopify Storefront GraphQL API, read-only product and
  collection JSON endpoints, and an agents.md / llms.txt pair stating the store''s agent
  access policy.'
image: https://voyagefoods.com/cdn/shop/files/ComboTabletop_0035_1_5.jpg?v=1697240864
url: https://raw.githubusercontent.com/api-evangelist/voyage-foods/refs/heads/main/apis.yml
