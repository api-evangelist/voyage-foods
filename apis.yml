apis:
- aid: voyage-foods-ucp-commerce-mcp
  name: Voyage Foods UCP Commerce MCP API
  description: 'The Voyage Foods storefront implements the Universal Commerce Protocol (UCP)
    for agent-driven commerce over MCP. A JSON-RPC 2.0 endpoint at /api/ucp/mcp answers
    tools/list anonymously with thirteen tools spanning catalog search and lookup, cart
    lifecycle, checkout lifecycle and order retrieval, each carrying a full JSON Schema
    2020-12 inputSchema. Payment completion requires contemporaneous human buyer approval
    and complete_checkout requires an idempotency key.'
  humanURL: https://voyagefoods.com/agents.md
  baseURL: https://voyagefoods.com/api/ucp/mcp
  tags:
  - MCP
  - Agentic Commerce
  - Universal Commerce Protocol
  - Checkout
  - Catalog
  properties:
  - type: MCPServer
    url: mcp/voyage-foods-mcp.yml
  - type: ToolCrosswalk
    url: mcp/voyage-foods-tool-crosswalk.yml
  - type: Documentation
    url: https://voyagefoods.com/agents.md
- aid: voyage-foods-storefront-graphql
  name: Voyage Foods Storefront GraphQL API
  description: 'The Shopify Storefront GraphQL API as deployed on the voyagefoods.com host
    at /api/2026-04/graphql.json. Anonymous introspection is open and returns a 416-type
    schema with 35 QueryRoot fields (products, collections, search, predictiveSearch, cart,
    blog/article, menu, shop, localization) and 41 Mutation fields covering the full
    Relay-style cart lifecycle, discount and gift-card codes, delivery addresses, Shop Pay
    payment-request sessions and customer access tokens.'
  humanURL: https://shopify.dev/docs/api/storefront
  baseURL: https://voyagefoods.com/api/2026-04/graphql.json
  tags:
  - GraphQL
  - Ecommerce
  - Storefront
  - Cart
  - Catalog
  properties:
  - type: GraphQL
    url: graphql/voyage-foods-storefront.graphql
  - type: Documentation
    url: https://shopify.dev/docs/api/storefront
- aid: voyage-foods-storefront-json
  name: Voyage Foods Storefront Product JSON API
  description: 'The read-only, unauthenticated product and collection JSON endpoints the
    store documents for agents in agents.md — /products.json, /products/{handle}.json,
    /collections/{handle}/products.json and /search?q={query}&type=product — returning
    product, variant, price, weight, availability and image records for the Voyage Foods
    sample and bulk catalog.'
  humanURL: https://voyagefoods.com/agents.md
  baseURL: https://voyagefoods.com/products.json
  tags:
  - Ecommerce
  - Catalog
  - Products
  - JSON
  - Read Only
  properties:
  - type: Documentation
    url: https://voyagefoods.com/agents.md
