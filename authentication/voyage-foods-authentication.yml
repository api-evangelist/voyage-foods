- name: ShopifyOAuthAuthorizationServer
  type: oauth2
  spec: RFC 8414
  metadata_url: https://voyagefoods.com/.well-known/oauth-authorization-server
  note: >-
    The RFC 8414 authorization-server metadata document is byte-identical to the OIDC discovery
